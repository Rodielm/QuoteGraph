name: Publish Backend & Frontend to GHCR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Audit backend dependencies (pip-audit)
        working-directory: ./backend
        run: |
          uv sync --frozen
          uv run pip install pip-audit
          uv run pip-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit frontend dependencies (npm audit)
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=high

  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.set_owner.outputs.owner }}
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - name: Lowercase Owner
        id: set_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  backend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/quotegraph-backend:latest
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/quotegraph-backend:${{ needs.prepare.outputs.short_sha }}

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/quotegraph-frontend:latest
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/quotegraph-frontend:${{ needs.prepare.outputs.short_sha }}

services:
  neo4j:
    image: neo4j:5-community
    container_name: quotegraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER}/quotegraph-backend:${IMAGE_TAG:-latest}
    container_name: quotegraph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_OWNER}/quotegraph-frontend:${IMAGE_TAG:-latest}
    container_name: quotegraph-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      FRONTEND_API_URL: ${FRONTEND_API_URL}
    depends_on:
      - backend

volumes:
  neo4j_data:

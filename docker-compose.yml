services:
  neo4j:
    image: neo4j:5-community
    container_name: quotegraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/quotegraph123
    volumes:
      - neo4j_data:/data
      - ./database/imports:/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "quotegraph123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: quotegraph-backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: quotegraph123
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: quotegraph-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  neo4j_data:
